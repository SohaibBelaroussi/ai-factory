server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: every non-file path falls back to the app shell.
  location / {
    try_files $uri /index.html;
  }

  # Public API behind one prefix. The trailing slash on proxy_pass strips
  # /api/ — /api/runs becomes /runs on the backend.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # SSE: no buffering, and hold long-lived streams open.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
